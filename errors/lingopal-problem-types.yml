notes: >-
  Lingopal does not use RFC 9457 application/problem+json. Errors are returned as
  application/json. Validation failures (422) carry a FastAPI-style HTTPValidationError
  envelope with a detail[] array; each entry has loc (path to the invalid field),
  msg, type, input and ctx. The documented error reference is the status table at
  https://docs.lingopal.ai/guides/errors-and-validation.
