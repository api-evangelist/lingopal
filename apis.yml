aid: lingopal
name: Lingopal
description: >-
  Lingopal is an AI translation company building a real-time language layer for live
  and on-demand video. Its platform delivers sub-10-second AI dubbing and captioning for
  livestreams across 100+ languages, preserving speaker characteristics through voice
  cloning, and targets sports and news broadcasters, streaming and FAST channel
  operators, live events, faith organizations, and contact centers. Lingopal also
  publishes a public v2 REST API for uploading media and documents, starting translation
  and dubbing workflows, generating subtitle tracks, translating text synchronously, and
  downloading generated transcripts and subtitles. The API is documented at
  docs.lingopal.ai with a machine-readable OpenAPI 3.1 specification, is authenticated
  with an X-API-Key header, and exposes 112 locales with per-locale text, dubbing, and
  voice-cloning capability flags.
